services:
  mysql:
    image: mysql:8.4
    container_name: aquaflow-mysql
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aquaflow
      MYSQL_USER: aquaflow
      MYSQL_PASSWORD: aquaflow
    volumes:
      - aquaflow_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-proot']
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5
    container_name: aquaflow-phpmyadmin
    ports:
      - '8080:80'
    environment:
      PMA_HOST: mysql
      PMA_USER: aquaflow
      PMA_PASSWORD: aquaflow
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  aquaflow_mysql_data:
